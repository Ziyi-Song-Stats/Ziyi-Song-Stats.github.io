# Site settings for ziyi-song-stats.github.io
# Built by GitHub Pages (Jekyll). Edit this file to change names, links and the menu.

title: Ziyi Song
description: "CosmicAI Postdoctoral Fellow at UT Austin, working on statistics and AI for science."
url: https://ziyi-song-stats.github.io
baseurl: ""
lang: en

author:
  name: Ziyi Song
  # One line shown under your name on the home page.
  tagline: "CosmicAI Postdoctoral Fellow at UT Austin, working on statistics and AI for science."
  # To show a photo, upload it as images/profile.jpg. Without it, the home page shows your initials.
  avatar: /images/profile.jpg
  initials: ZS
  # Shown in small text under your name on the home page.
  chinese_name: 宋子毅
  pronunciation: Zee-yee Song
  # Optional: record yourself saying your name and upload it as files/name.mp3.
  # A small speaker button appears next to the pronunciation once the file exists.
  name_audio: /files/name.mp3
  email: ziyisongstats@utexas.edu   # primary email, used by the mail icon on the home page
  scholar: https://scholar.google.com/citations?user=Z5wpiKkAAAAJ
  github: https://github.com/Ziyi-Song-Stats
  linkedin: https://www.linkedin.com/in/ziyi-song-402643209/
  orcid: https://orcid.org/0009-0000-3376-9113

# Your CV PDF. Replace files/Ziyi_Song_CV.pdf to update it.
cv: /files/Ziyi_Song_CV.pdf

# Top menu (inner pages) and the buttons on the home page.
navigation:
  - title: About
    url: /about/
  - title: Research
    url: /research/
  - title: Experience
    url: /experience/
  - title: Awards
    url: /Awards/
  - title: Talks & Service
    url: /talks/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /files/Ziyi_Song_CV.pdf

# Private visitor statistics. Nothing is shown on the website; you see the numbers
# in the service's own dashboard. Fill in ONE of these after signing up (leave the other blank).
analytics:
  google_id:     # Google Analytics 4 measurement ID, e.g. G-XXXXXXXXXX
  goatcounter:   # GoatCounter code, e.g. ziyisong (from ziyisong.goatcounter.com)

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - .sass-cache
  - .claude

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: page
